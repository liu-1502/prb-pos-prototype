<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>PRB HQ Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: HQ back office — dark command bar, left nav, content column of cards and tables; side detail panel on approvals; one shared dialog */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#FAF9F6; --line:#E3E0D8; --line-2:#CFCBC1;
  --ink:#17201C; --muted:#56605B;
  --bar:#17201C; --bar-2:#26312C; --bar-ink:#FFFFFF; --bar-muted:#B9C2BD;
  --accent:#0B6B4F; --accent-ink:#FFFFFF; --accent-soft:#E3F1EB; --accent-soft-ink:#0A4F3B;
  --warn-soft:#FFF1D6; --warn-ink:#5C3B00; --bad-soft:#FDE7D3; --bad-ink:#7A2608;
  --info-soft:#E4EEFA; --info-ink:#1D4F7A;
  --scrim:rgba(23,32,28,.5); --shadow:0 18px 48px rgba(23,32,28,.18);
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#1A221E; --surface-2:#151C19; --line:#2B3631; --line-2:#3B4842;
    --ink:#EDF2EF; --muted:#A4B0AA;
    --bar:#0A0F0D; --bar-2:#1D2723; --bar-ink:#FFFFFF; --bar-muted:#9DA9A3;
    --accent:#3DBB8C; --accent-ink:#06140E; --accent-soft:#173A2D; --accent-soft-ink:#BDEBD4;
    --warn-soft:#3A2C0E; --warn-ink:#FFD99A; --bad-soft:#3E2014; --bad-ink:#FFC4A6;
    --info-soft:#16283A; --info-ink:#B8D6F5;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221E; --surface-2:#151C19; --line:#2B3631; --line-2:#3B4842;
  --ink:#EDF2EF; --muted:#A4B0AA;
  --bar:#0A0F0D; --bar-2:#1D2723; --bar-ink:#FFFFFF; --bar-muted:#9DA9A3;
  --accent:#3DBB8C; --accent-ink:#06140E; --accent-soft:#173A2D; --accent-soft-ink:#BDEBD4;
  --warn-soft:#3A2C0E; --warn-ink:#FFD99A; --bad-soft:#3E2014; --bad-ink:#FFC4A6;
  --info-soft:#16283A; --info-ink:#B8D6F5;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.bar{background:var(--bar);color:var(--bar-ink)}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{width:36px;height:36px;border-radius:9px;background:#0B6B4F;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:15px;display:block}.brand small{font-size:12px;color:var(--bar-muted);display:block}
.spacer{flex:1}
.bar select{height:40px;border-radius:10px;border:0;background:var(--bar-2);color:var(--bar-ink);padding:0 10px;font-size:13px;font-weight:700}
.bar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bar-muted)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-block:20px;align-items:start}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink)}
.nav a .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad-soft);color:var(--bad-ink);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:15px;font-weight:800}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .d{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--accent)}.down{color:var(--bad-ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:36px;padding:0 14px;border-radius:8px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad-ink)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.sel td{background:var(--accent-soft)}
.rowbtn{border:0;background:none;padding:0;font-weight:800;color:var(--ink);text-align:left}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:6px;padding:3px 7px;white-space:nowrap}
.b-ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink)}
.b-bad{background:var(--bad-soft);color:var(--bad-ink)}
.b-info{background:var(--info-soft);color:var(--info-ink)}
.b-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.field input,.field select,.field textarea{min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:8px 12px;font-weight:500}
.field textarea{resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}
.math{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.math .r{display:flex;justify-content:space-between;gap:12px}
.math .t{border-top:1px solid var(--line);padding-top:6px;font-weight:800}
.lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--info-soft);color:var(--info-ink);font-size:13px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.hbar .track{height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:6px}
.hbar.mute .fill{background:var(--line-2)}
.heat{display:grid;grid-template-columns:44px repeat(16,minmax(0,1fr));gap:3px;font-size:11px;color:var(--muted)}
.heat .c{height:22px;border-radius:4px}
.heat .lbl{display:flex;align-items:center}
.heat .hh{text-align:center}
svg .bar{fill:var(--accent)}
svg .bar.cur{fill:var(--ink)}
svg .grid{stroke:var(--line)}
svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.dig{display:flex;flex-direction:column;gap:10px}
.dig li{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.dig ul{margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.dot{width:10px;height:10px;border-radius:5px;margin-top:5px}
.d-bad{background:#D9534F}.d-warn{background:#E0A21B}.d-ok{background:#1DB15A}.d-info{background:#3C82D6}
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:var(--line-2);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.promo{display:flex;flex-direction:column;gap:10px}
.promo-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.promo-h b{font-size:15px}
.meter{height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}

.thread{flex:1;min-height:300px;max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.me{align-self:flex-end;max-width:82%;background:var(--ink);color:var(--bg);border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;max-width:92%;background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 13px}
.bot ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.bot .chips{margin-top:8px}
.dcard{align-self:stretch;border:1px solid var(--line-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sugg button{flex:none;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700}
.comp{display:flex;gap:10px;align-items:flex-end}
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:720px;max-height:100%;overflow:auto;display:flex;flex-direction:column}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:19px;font-weight:800}
.dlg-h p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:min(560px, calc(100% - 32px))}

@media (max-width: 1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} .panel{position:static} .g2,.g3{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  .nav a{flex:none}
  .nav .sep{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in gut">
    <div class="brand"><span class="logo">PRB</span><span><b>HQ Console</b><small id="today"></small></span></div>
    <div class="spacer"></div>
    <label>Outlet<select id="outletSel" aria-label="Outlet"><option>[Pilot outlet]</option><option disabled>More outlets — out of scope for this delivery</option></select></label>
    <label>Signed in as<select id="userSel" aria-label="Signed in as"></select></label>
  </div>
</header>

<div class="shell gut">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<div class="scrim" id="dlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dlgBox"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const r3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
const rm = n => (n < 0 ? '−' : '') + 'RM ' + Math.abs(n).toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
const rm0 = n => 'RM ' + Math.round(n).toLocaleString('en-MY');
const pct = n => (Math.round(n * 1000) / 10).toFixed(1) + '%';
const NOW = new Date();
const ago = m => new Date(NOW.getTime() - m * 60000);
const tm = d => d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
const dt = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}) + ', ' + tm(d);
const age = d => { const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3600); }

/* ---------------- sample data (illustrative) ---------------- */
const ROLES = {cashier:'Cashier', supervisor:'Supervisor', outlet_manager:'Outlet manager', branch_operator:'Branch operator', hq_admin:'HQ admin', hq_approver:'HQ approver', auditor:'Auditor', coo:'COO'};
const USERS = [
  {id:'nadia', name:'Nadia', role:'hq_approver', outlet:'HQ', active:true},
  {id:'hafiz', name:'Hafiz', role:'hq_admin', outlet:'HQ', active:true},
  {id:'mei', name:'Mei', role:'auditor', outlet:'HQ', active:true},
  {id:'daniel', name:'Daniel', role:'coo', outlet:'HQ', active:true},
  {id:'farid', name:'Farid', role:'outlet_manager', outlet:'[Pilot outlet]', active:true},
  {id:'siti', name:'Siti', role:'branch_operator', outlet:'[Pilot outlet]', active:true},
  {id:'aina', name:'Aina', role:'cashier', outlet:'[Pilot outlet]', active:true},
  {id:'ravi', name:'Ravi', role:'supervisor', outlet:'[Pilot outlet]', active:true}
];
const PERMS = [
  ['Take orders & payments', ['cashier','supervisor','outlet_manager']],
  ['Refund / void after payment', ['supervisor','outlet_manager']],
  ['Submit stock requests', ['branch_operator','outlet_manager']],
  ['Approve stock requests', ['hq_approver']],
  ['Approve supplier orders', ['hq_approver','hq_admin']],
  ['Edit menu, recipes & prices', ['hq_admin']],
  ['Edit ingredient catalogue', ['hq_admin']],
  ['Suppliers & promotions', ['hq_admin']],
  ['Manage users & roles', ['hq_admin']],
  ['Review register closes', ['hq_approver','hq_admin','coo']],
  ['View HQ dashboard', ['hq_admin','hq_approver','coo','auditor']],
  ['Copy audit log', ['auditor','hq_admin']]
];
const S = {user:'nadia', period:'7', reqTab:'pending', reqFlags:[], reqSel:null, poTab:'pending', poSel:null, poRoute:null, suppFilter:'all', menuQ:'', auditType:'all', auditQ:'', closeOnly:false, seq:2000, chat:[], cprops:{}, cdraft:null};
const me = () => USERS.find(u => u.id === S.user);
const can = p => PERMS.find(x => x[0] === p)[1].includes(me().role);
const whoCan = p => PERMS.find(x => x[0] === p)[1];
function lockNote(p){
  if (can(p)) return '';
  const role = whoCan(p).find(r => USERS.some(u => u.role === r && ['hq_admin','hq_approver','auditor','coo'].includes(u.role)));
  const u = USERS.find(x => x.role === role);
  return `<div class="lock"><span>${esc(p)} needs the ${esc(ROLES[role] || role)} role. You’re signed in as ${esc(me().name)} (${esc(ROLES[me().role])}).</span>${u ? `<button type="button" class="btn sm" data-act="switch" data-v="${u.id}">Switch to ${esc(u.name)}</button>` : ''}</div>`;
}

const ING = [
  {id:'rice', name:'Rice', unit:'kg', low:5, onHand:31.5, manual:null},
  {id:'chicken_leg', name:'Chicken leg', unit:'kg', low:2, onHand:6.2, manual:null},
  {id:'chicken_breast', name:'Chicken breast', unit:'kg', low:1, onHand:0.1, manual:null},
  {id:'egg', name:'Eggs', unit:'pcs', low:20, onHand:79, manual:null},
  {id:'sambal', name:'Sambal', unit:'portions', low:10, onHand:36, manual:0.60, note:'Made in-house'},
  {id:'noodles', name:'Yellow noodles', unit:'kg', low:2, onHand:11.4, manual:null},
  {id:'prawn', name:'Prawns', unit:'kg', low:0.5, onHand:1.9, manual:null},
  {id:'dough', name:'Roti dough', unit:'pcs', low:15, onHand:57, manual:0.55, note:'Made in-house'},
  {id:'tea', name:'Tea base', unit:'portions', low:20, onHand:116, manual:null},
  {id:'coffee', name:'Coffee base', unit:'portions', low:20, onHand:78, manual:null},
  {id:'milo', name:'Milo powder', unit:'portions', low:5, onHand:3, manual:null}
];
const IB = id => ING.find(i => i.id === id);
const SUPP = {sa:'Supplier A · Poultry & eggs', sb:'Supplier B · Dry goods', sc:'Supplier C · Seafood', sd:'Supplier D · Beverages', se:'Supplier E · Seafood', sf:'Supplier F · Wholesale market', sg:'Supplier G · Poultry'};
/* lead time in days, delivery weekdays (1 = Mon … 7 = Sun), minimum order RM, how orders are sent */
const SUPINFO = {

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const wd = (day.getDay() + 6) % 7;
  const orders = Math.round((wd >= 5 ? 160 : 132) * (0.88 + rnd() * 0.24));
  const aov = 27.5 + rnd() * 4;
  const cogs = 0.27 + rnd() * 0.04;
  const tot = PROFILE.reduce((a,b) => a + b, 0);
  const hourly = PROFILE.map(w => w / tot * (0.85 + rnd() * 0.3));
  const hs = hourly.reduce((a,b) => a + b, 0);
  const rev = orders * aov;
  const cats = {rice:0.36 + rnd() * 0.05, noodles:0.22 + rnd() * 0.04, roti:0.13 + rnd() * 0.03, drinks:0.22 + rnd() * 0.04};

}

/* decisions shared by the screens and the chat */
function checkReq(id, approve){
  const r = REQ.find(x => x.id === id);
  if (!r) return `I can’t find ${id}.`;
  if (r.status !== 'pending') return `${id} was already ${r.status}.`;
  if (!can('Approve stock requests')) return `Deciding ${id} needs the HQ approver role. You’re signed in as ${me().name} (${ROLES[me().role]}).`;
  if (r.by === S.user) return `${id} is your own request, so another HQ approver has to decide it.`;
  if (approve && r3(IB(r.ing).onHand + reqDelta(r)) < 0) return `${id} would take ${IB(r.ing).name} below zero, so it can’t be approved.`;
  return null;
}
function decideReq(id, approve, note){
  const err = checkReq(id, approve); if (err) return {ok:false, msg:err};
  if (!approve && !note) return {ok:false, msg:'Add a reason so the outlet knows what to fix.'};
  const r = REQ.find(x => x.id === id), i = IB(r.ing), d = reqDelta(r), before = i.onHand;
  if (approve) { i.onHand = r3(i.onHand + d); audit('Stock', `Approved ${r.id} · ${TYPE[r.type]} · ${i.name} ${fd(r.ing, d)} · ${fq(r.ing, before)} → ${fq(r.ing, i.onHand)}${note ? ' · ' + note : ''}`); }
  else audit('Stock', `Rejected ${r.id} · ${TYPE[r.type]} · ${i.name} ${fd(r.ing, d)} · ${note}`);
  r.status = approve ? 'approved' : 'rejected'; r.dBy = S.user; r.dAt = new Date(); r.note = note || '';
  return {ok:true, msg:approve ? `${r.id} approved · ${i.name} now ${fq(r.ing, i.onHand)}` : `${r.id} rejected · outlet notified`};
}
function checkPO(id){
  const o = PO.find(x => x.id === id);
  if (!o) return `I can’t find ${id}.`;
  if (o.status !== 'pending') return `${id} is already ${PO_ST[o.status][1].toLowerCase()}.`;
  if (!can('Approve supplier orders')) return `Deciding ${id} needs the HQ approver or HQ admin role. You’re signed in as ${me().name} (${ROLES[me().role]}).`;
  if (o.by === S.user) return `${id} is your own order, so someone else has to approve it.`;
  return null;
}
function decidePO(id, approve, note, routeQ){
  const err = checkPO(id); if (err) return {ok:false, msg:err};
  if (!approve && !note) return {ok:false, msg:'Add a reason so the outlet knows why.'};
  const o = PO.find(x => x.id === id);
  if (!approve) {
    o.status = 'rejected'; o.dBy = S.user; o.dAt = new Date(); o.note = note;
    audit('Supplier order', `Rejected ${o.id} · ${supName(o.sup)} · ${rm(o.total)} · ${note}`);
    return {ok:true, msg:`${o.id} rejected · outlet sees your reason`};
  }
  const plan = planFor(o, routeQ || o.lines.map(l => l.qid));
  const off = plan.find(p => !SUPINFO[p.sup].active);
  if (off) return {ok:false, msg:`${supName(off.sup)} is inactive. Pick another supplier for ${IB(off.ing).name}.`};
  const orig = o.sup, groups = groupPlan(plan, o.needed).sort((a, b) => (a.sup === orig ? -1 : b.sup === orig ? 1 : 0));
  const made = groups.map((g, k) => {
    const L = g.lines.map(p => ({ing:p.ing, req:p.req, packs:p.packs, pack:p.pack, packPrice:p.packPrice, qid:p.qid, sup:p.sup}));
    let t = o;
    if (k > 0) { t = Object.assign({}, o, {id:nextPOId(), splitFrom:o.id}); PO.push(t); }
    Object.assign(t, {sup:g.sup, lines:L, total:g.total, status:'ordered', dBy:S.user, dAt:new Date(), note:note || '', method:SUPINFO[g.sup].via, eta:g.next, rerouted:g.sup !== orig ? orig : null});
    audit('Supplier order', `Approved ${t.id}${t.splitFrom ? ' (split from ' + t.splitFrom + ')' : ''} · ${supName(g.sup)}${t.rerouted ? ' (rerouted from ' + supName(orig) + ')' : ''} · ${rm(g.total)} · sent by ${t.method.toLowerCase()} · arrives ${dshort(g.next)}${note ? ' · ' + note : ''}`);
    return t;
  });
  return {ok:true, msg:made.length > 1 ? `${o.id} approved and split: ${made.map(t => `${t.id} → ${supName(t.sup)}`).join(', ')}` : `${made[0].id} approved · sent to ${supName(made[0].sup)} by ${made[0].method.toLowerCase()}${made[0].rerouted ? ' (rerouted)' : ''}`};
}
function nextPOId(){ const n = Math.max(...PO.map(o => Number(o.id.slice(3)))) + 1; return 'PO-' + String(n).padStart(4, '0'); }
const endOfDay = d => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
function planFor(o, routeQ){
  return o.lines.map((l, k) => {
    const q = QUOTES.find(x => x.id === routeQ[k]) || QUOTES.find(x => x.id === l.qid);
    const req = l.req || l.packs * l.pack;
    const packs = q.id === l.qid ? l.packs : Math.max(1, Math.ceil(r3(req / q.pack)));
    return {ing:l.ing, req, packs, pack:q.pack, packPrice:q.price, qid:q.id, sup:q.sup, cost:r2(packs * q.price)};
  });
}
function groupPlan(plan, needed){
  const g = {}; plan.forEach(p => (g[p.sup] = g[p.sup] || []).push(p));
  return Object.keys(g).map(sup => { const total = r2(g[sup].reduce((s, p) => s + p.cost, 0)), next = nextDelivery(sup); return {sup, lines:g[sup], total, next, onTime:next <= endOfDay(needed), belowMin:total < SUPINFO[sup].min}; });
}
function getRoute(o){ if (!S.poRoute || S.poRoute.id !== o.id) S.poRoute = {id:o.id, q:o.lines.map(l => l.qid)}; return S.poRoute.q; }
const lineCost = (l, q) => Math.max(1, Math.ceil(r3((l.req || l.packs * l.pack) / q.pack))) * q.price;
function routesVia(o, sup){
  const q = [];
  for (const l of o.lines) {
    const opts = QUOTES.filter(x => x.ing === l.ing && x.sup === sup).sort((a, b) => lineCost(l, a) - lineCost(l, b));
    if (!opts.length) return {err:`${supName(sup)} has no quote for ${IB(l.ing).name}.`};
    q.push(opts[0].id);
  }
  if (!SUPINFO[sup].active) return {err:`${supName(sup)} is inactive.`};
  return {q};
}
function cheapestOnTime(o){
  return o.lines.map(l => {
    const opts = QUOTES.filter(x => x.ing === l.ing && SUPINFO[x.sup].active);
    const onTime = opts.filter(x => nextDelivery(x.sup) <= endOfDay(o.needed));
    const pool = onTime.length ? onTime : opts;
    return pool.sort((a, b) => lineCost(l, a) - lineCost(l, b))[0].id;
  });
}
function altRoutes(o){
  return Object.keys(SUPP).filter(k => k !== o.sup && SUPINFO[k].active).map(k => { const r = routesVia(o, k); if (r.err) return null; const g = groupPlan(planFor(o, r.q), o.needed)[0]; return {sup:k, total:g.total, next:g.next, onTime:g.onTime}; }).filter(Boolean).sort((a, b) => a.total - b.total);
}

function poDetail(){
  const o = PO.find(x => x.id === S.poSel);
  if (!o) return '<div class="card empty">Select an order to review it.</div>';
  const pending = o.status === 'pending', err = pending ? checkPO(o.id) : null, edit = pending && !err;
  const rq = pending ? getRoute(o) : o.lines.map(l => l.qid);
  const plan = planFor(o, rq), groups = groupPlan(plan, o.needed);
  const total = r2(plan.reduce((s, p) => s + p.cost, 0));
  const changed = pending && plan.some((p, k) => p.qid !== o.lines[k].qid);
  const allSup = Object.keys(SUPP).filter(k => SUPINFO[k].active && o.lines.every(l => QUOTES.some(q => q.sup === k && q.ing === l.ing)));
  const lineRows = plan.map((p, k) => {
    const opts = QUOTES.filter(q => q.ing === p.ing && (SUPINFO[q.sup].active || q.id === p.qid)).sort((a, b) => a.price / a.pack - b.price / b.pack);
    const cell = edit ? `<select aria-label="Supplier for ${esc(IB(p.ing).name)}" data-chg="poline" data-k="${k}" style="min-height:36px;max-width:100%;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:0 8px">${opts.map(q => `<option value="${q.id}" ${q.id === p.qid ? 'selected' : ''}>${esc(supName(q.sup))} · ${rm(q.price / q.pack)}/${unitLabel(p.ing)} · ${fq(p.ing, q.pack)} pack · ${dshort(nextDelivery(q.sup))}</option>`).join('')}</select>` : `<b>${esc(supName(p.sup))}</b>`;
    return `<tr><td>${esc(IB(p.ing).name)}<br><span class="note">asked ${fq(p.ing, p.req)}</span></td><td>${cell}</td><td class="r">${p.packs} × ${fq(p.ing, p.pack)}</td><td class="r">${rm(p.cost)}</td></tr>`;
  }).join('');
  const groupRows = groups.map(g => `<div class="r" style="flex-wrap:wrap"><span><b>${esc(supName(g.sup))}</b> · ${g.lines.length} line${g.lines.length > 1 ? 's' : ''} · sends by ${esc(SUPINFO[g.sup].via.toLowerCase())}</span><b class="num">${rm(g.total)}</b></div><div style="display:flex;gap:6px;flex-wrap:wrap">${pending ? (g.onTime ? `<span class="badge b-ok">Arrives ${dshort(g.next)} · on time</span>` : `<span class="badge b-bad">Arrives ${dshort(g.next)} · after ${dshort(o.needed)}</span>`) : `<span class="badge b-mute">ETA ${o.eta ? dshort(o.eta) : '—'}</span>`}${pending && SUPINFO[g.sup].min ? (g.belowMin ? `<span class="badge b-warn">Below ${rm(SUPINFO[g.sup].min)} minimum</span>` : `<span class="badge b-mute">Min ${rm(SUPINFO[g.sup].min)} met</span>`) : ''}</div>`).join('');
  const diff = r2(total - o.total);
  const summary = `<div class="math">${groupRows}<div class="r t"><span>Total${groups.length > 1 ? ` · splits into ${groups.length} orders` : ''}</span><span class="num">${rm(total)}</span></div>${pending && diff !== 0 ? `<div class="note">Requested route ${esc(supName(o.sup))}: ${rm(o.total)} · ${diff < 0 ? 'saves ' + rm(-diff) : 'costs ' + rm(diff) + ' more'}</div>` : ''}</div>`;
  const routeCtl = edit ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end"><label class="field" style="flex:1;min-width:180px">Route whole order to<select data-chg="poall"><option value="">Choose a supplier…</option>${allSup.map(k => `<option value="${k}">${esc(supName(k))}</option>`).join('')}</select></label><button type="button" class="btn sm" data-act="pocheap">Cheapest on time</button><button type="button" class="btn sm" data-act="poreset" ${changed ? '' : 'disabled'}>Reset route</button></div>` : '';
  let act;
  if (pending) {
    act = err ? `<div class="lock">${esc(err)}</div>` : `${groups.some(g => !g.onTime) ? '<p class="note down" style="margin:0">One delivery arrives after the needed date. Pick a faster supplier or confirm the outlet can wait.</p>' : ''}<label class="field">Note (required to reject)<textarea id="poNote" rows="2" placeholder="e.g. Prawns on hand cover two more days"></textarea></label>
      <div style="display:flex;gap:8px"><button type="button" class="btn primary" style="flex:1" data-act="po-ok" data-v="${o.id}">Approve & send to ${groups.length > 1 ? groups.length + ' suppliers' : esc(supName(groups[0].sup))}</button><button type="button" class="btn danger" data-act="po-no" data-v="${o.id}">Reject</button></div>`;
  } else {
    act = `<div class="math"><div class="r"><span>${o.status === 'rejected' ? 'Rejected' : 'Approved'} by</span><b>${esc(uName(o.dBy))}</b></div><div class="r"><span>When</span><b>${dt(o.dAt)}</b></div>${o.status !== 'rejected' ? `<div class="r"><span>Sent by</span><b>${esc(o.method || 'Email')}</b></div>` : ''}${o.rerouted ? `<div class="r"><span>Rerouted from</span><b>${esc(supName(o.rerouted))}</b></div>` : ''}${o.splitFrom ? `<div class="r"><span>Split from</span><b>${esc(o.splitFrom)}</b></div>` : ''}${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}</div>`;
  }
  const L = o.lines.map(l => { const i = IB(l.ing), qty = l.packs * l.pack; return {l, i, cover:USE[l.ing] ? i.onHand / USE[l.ing] : null, after:r3(i.onHand + qty)}; });
  return `<section class="card" style="display:flex;flex-direction:column;gap:12px" aria-label="${o.id}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">${o.id} · ${esc(supName(o.sup))}</h2><span class="badge ${PO_ST[o.status][0]}">${PO_ST[o.status][1]}</span></div>
    ${changed ? `<div class="chips"><span class="badge b-info">Rerouted from ${esc(supName(o.sup))} — not saved until you approve</span></div>` : ''}
    <dl class="kv"><dt>Outlet</dt><dd>[Pilot outlet]</dd><dt>Raised by</dt><dd>${esc(uName(o.by))} · via assistant</dd><dt>Created</dt><dd>${dt(o.at)}</dd><dt>Needed by</dt><dd>${dshort(o.needed)}</dd></dl>
    <div class="bot" style="max-width:100%"><span class="note">Instruction to the assistant</span><br>“${esc(o.cmd)}”</div>
    ${routeCtl}
    <div class="tbl"><table><thead><tr><th>Ingredient</th><th>Supplier</th><th class="r">Packs</th><th class="r">Line</th></tr></thead><tbody>${lineRows}</tbody></table></div>
    ${summary}
    <div><b style="font-size:13px">Stock check</b><div class="tbl" style="margin-top:6px"><table><thead><tr><th>Ingredient</th><th class="r">On hand</th><th class="r">Cover</th><th class="r">After delivery</th></tr></thead><tbody>${L.map(x => `<tr><td>${esc(x.i.name)}</td><td class="r">${fq(x.l.ing, x.i.onHand)}</td><td class="r">${x.cover == null ? '—' : `<span class="badge ${x.cover < 1 ? 'b-bad' : x.cover < 3 ? 'b-warn' : 'b-ok'}">${x.cover.toFixed(1)} days</span>`}</td><td class="r">${fq(x.l.ing, x.after)}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin:6px 0 0">Cover = on hand ÷ average daily use over the last 4 weeks (sample).</p></div>
    ${act}
  </section>`;
}

  </tbody></table></div></section>`;
}

/* HQ chat */
const HQ_SUGG = ['How is today going?', 'What’s pending?', 'PO-0313', 'Approve PO-0313 via Supplier E', 'Approve PO-0314 via Supplier F', 'Approve R-1048', 'Reject PO-0313 because prawns on hand cover two more days', 'Show low stock'];
function hqBot(html){ S.chat.push({role:'bot', html}); }
function hqSend(text){ text = String(text || '').trim(); if (!text) return; S.chat.push({role:'me', text}); hqHandle(text); render(); const ta = $('#hqIn'); if (ta) ta.focus(); }
function idsIn(text){ return [...text.matchAll(/\b(r|po)\s*-?\s*(\d{3,4})\b/gi)].map(m => (m[1].toLowerCase() === 'r' ? 'R-' : 'PO-') + m[2].padStart(4, '0')); }
const chipsFor = id => `<div class="chips"><button type="button" class="chip" data-act="hq-ask" data-v="Approve ${id}">Approve ${id}</button><button type="button" class="chip" data-act="hq-ask" data-v="Reject ${id}">Reject ${id}</button></div>`;
function hqHandle(text){
  const t = ' ' + text.toLowerCase().replace(/[’']/g, '') + ' ';
  if (S.cdraft) {
    const d = S.cdraft; S.cdraft = null;
    if (/^\s*(cancel|stop|never ?mind|huỷ|hủy)\s*$/i.test(text)) { hqBot('Okay, nothing changed.'); return; }
    buildDecision(d.ids.map(id => ({id, approve:false, note:text.trim()}))); return;
  }
  const ids = [...new Set(idsIn(text))];
  const isRej = /(reject|decline|deny|từ chối|tolak)/.test(t), isApp = !isRej && /(approve|accept|duyệt|lulus|re-?route)/.test(t);
  if (ids.length && isApp) {
    const via = text.match(/(?:via|through|to|from|qua|using)\s+supplier\s+([a-z])\b/i), viaK = via ? 's' + via[1].toLowerCase() : null;
    if (viaK && !SUPP[viaK]) { hqBot(`I don’t know Supplier ${esc(via[1].toUpperCase())}. The Suppliers page lists them.`); return; }
    const items = [], errs = [];
    ids.forEach(id => {
      if (viaK && id.startsWith('PO-')) { const o = PO.find(x => x.id === id); if (!o) { errs.push(`I can’t find ${id}.`); return; } const r = routesVia(o, viaK); if (r.err) { errs.push(`${id}: ${r.err}`); return; } items.push({id, approve:true, routes:r.q}); }
      else items.push({id, approve:true});
    });
    if (errs.length) hqBot(errs.map(esc).join('<br>'));
    if (items.length) buildDecision(items);
    return;
  }
  if (ids.length && isRej) {
    if (isRej) {
      const m = text.match(/(?:because|reason:?|lý do:?|\svì|sebab)\s+(.+)$/i);
      if (!m) { S.cdraft = {ids}; hqBot(`What reason should the outlet see for ${esc(ids.join(', '))}? Type it, or “cancel”.`); return; }
      buildDecision(ids.map(id => ({id, approve:false, note:m[1].trim()}))); return;
    }
    buildDecision(ids.map(id => ({id, approve:true}))); return;
  }
  if (ids.length) { hqBot(ids.map(describe).join('<br>')); return; }
  if (/(today|how.*(going|doing)|summary|overview|tình hình|hôm nay|ringkasan)/.test(t)) { hqBot(todaySummary()); return; }
  if (/(pending|waiting|queue|chờ duyệt)/.test(t)) { hqBot(pendingList()); return; }
  if (/(low stock|running low|out of stock|sắp hết|habis|\slow\s)/.test(t)) { hqBot(lowList()); return; }
  if (/(supplier order|purchase|\bpos?\b|đơn đặt)/.test(t)) { hqBot(poList()); return; }
  if (/(sell|selling|best|top|bán chạy)/.test(t)) { hqBot(salesToday()); return; }
  hqBot('I can summarise today, list what’s pending, show low stock and supplier orders, and approve or reject by ID. Try “how is today going?”, “approve R-1048” or “reject PO-0313 because prawns on hand cover two more days”.');
}
function describe(id){
  if (id.startsWith('R-')) {
    const r = REQ.find(x => x.id === id); if (!r) return `I can’t find ${esc(id)}.`;
    const i = IB(r.ing);
    return `<b>${r.id}</b> · ${TYPE[r.type]} · ${esc(i.name)} ${fd(r.ing, reqDelta(r))} · by ${esc(uName(r.by))} · ${r.status === 'pending' ? 'waiting ' + age(r.at) : r.status} · “${esc(r.reason)}”` + (r.status === 'pending' ? chipsFor(r.id) : '');
  }
  const o = PO.find(x => x.id === id); if (!o) return `I can’t find ${esc(id)}.`;
  let alt = '';
  if (o.status === 'pending') { const a = altRoutes(o); if (a.length) alt = `<br>Other routes: ${a.map(x => `${esc(supName(x.sup))} ${rm(x.total)}${x.onTime ? '' : ' (late)'}`).join(', ')}<div class="chips">${a.slice(0, 2).map(x => `<button type="button" class="chip" data-act="hq-ask" data-v="Approve ${o.id} via ${esc(supName(x.sup))}">Approve via ${esc(supName(x.sup))}</button>`).join('')}</div>`; }
  return `<b>${o.id}</b> · ${esc(supName(o.sup))} · ${o.lines.map(l => esc(IB(l.ing).name) + ' ' + fq(l.ing, l.packs * l.pack)).join(', ')} · ${rm(o.total)} · arrives ${dshort(nextDelivery(o.sup))} · ${PO_ST[o.status][1].toLowerCase()}` + alt + (o.status === 'pending' ? chipsFor(o.id) : '');
}
function todaySummary(){
  const d = DAYS[DAYS.length - 1], lw = DAYS[DAYS.length - 8], h = NOW.getHours();
  const part = x => x.hourly.reduce((s, v, i) => s + (HOURS[i] <= h ? v : 0), 0);
  const rev = part(d), lwRev = part(lw);
  const pend = REQ.filter(r => r.status === 'pending'), stale = pend.filter(r => reqFlags(r).includes('stale'));
  const pos = PO.filter(o => o.status === 'pending'), posSum = r2(pos.reduce((s, o) => s + o.total, 0));
  const low = ING.filter(i => i.onHand <= i.low), cl = CLOSES.filter(c => c.cnt !== c.exp && !c.reviewed);
  const L = [];
  if (rev > 0) { const ch = lwRev ? (rev - lwRev) / lwRev : 0; L.push(`Revenue <b>${rm0(rev)}</b> from about ${Math.round(d.orders * rev / d.rev)} orders, ${ch >= 0 ? 'up' : 'down'} ${pct(Math.abs(ch))} on last ${lw.day.toLocaleDateString('en-GB', {weekday:'long'})} at the same time. Gross margin ${pct(d.gp / d.rev)}.`); }
  else L.push('No sales yet today.');
  L.push(`<b>${pend.length}</b> stock request${pend.length === 1 ? '' : 's'} waiting${stale.length ? `, ${stale.length} older than 4 h (${stale.map(r => r.id).join(', ')})` : ''}. <a href="#approvals">Open approvals</a>`);
  L.push(`<b>${pos.length}</b> supplier order${pos.length === 1 ? '' : 's'} waiting, ${rm(posSum)} in total. <a href="#purchases">Open supplier orders</a>`);
  L.push(low.length ? `Low stock: ${low.map(i => `${esc(i.name)} (${fq(i.id, i.onHand)})`).join(', ')}.` : 'No ingredient is below its low-stock level.');
  if (cl.length) L.push(`${cl.length} register close${cl.length === 1 ? '' : 's'} with over/short to review. <a href="#closes">Open closes</a>`);
  return `<b>Today so far, to ${tm(NOW)}</b> · [Pilot outlet] · sample figures<ul>${L.map(l => `<li>${l}</li>`).join('')}</ul><div class="chips"><button type="button" class="chip" data-act="hq-ask" data-v="What’s pending?">What’s pending?</button><button type="button" class="chip" data-act="hq-ask" data-v="Show low stock">Show low stock</button></div>`;
}
function pendingList(){
  const pend = REQ.filter(r => r.status === 'pending').sort((a, b) => a.at - b.at), pos = PO.filter(o => o.status === 'pending').sort((a, b) => a.at - b.at);
  if (!pend.length && !pos.length) return 'Nothing is waiting for a decision.';
  const rq = pend.map(r => { const fl = reqFlags(r).filter(f => f !== 'self'); return `<li><b>${r.id}</b> ${TYPE[r.type]} · ${esc(IB(r.ing).name)} ${fd(r.ing, reqDelta(r))} · ${age(r.at)}${fl.length ? ' · ' + fl.map(f => FLAG[f][1].toLowerCase()).join(', ') : ''}${r.by === S.user ? ' · your request' : ''}</li>`; }).join('');
  const po = pos.map(o => `<li><b>${o.id}</b> ${esc(supName(o.sup))} · ${o.lines.map(l => esc(IB(l.ing).name)).join(', ')} · ${rm(o.total)} · ${age(o.at)}</li>`).join('');
  const clean = pend.filter(r => !reqFlags(r).length);

function effectOf(it){

function buildDecision(items){

function cardHTML(pid){
