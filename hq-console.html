function salesToday(){ const d = DAYS[DAYS.length - 1]; const c = Object.entries(d.cats).sort((a, b) => b[1] - a[1]); return `Today’s sales mix by category: ${c.map(([k, v]) => `${CAT[k]} ${pct(v / d.rev)}`).join(', ')}. Dish-level detail comes from the till’s sales report.`; }
function effectOf(it){
  if (it.id.startsWith('R-')) { const r = REQ.find(x => x.id === it.id), i = IB(r.ing), d = reqDelta(r); return it.approve ? `${i.name} ${fq(r.ing, i.onHand)} → ${fq(r.ing, r3(i.onHand + d))}` : `No stock change. Outlet sees: “${it.note}”`; }
  const o = PO.find(x => x.id === it.id);
  if (!it.approve) return `Not sent. Outlet sees: “${it.note}”`;
  const g = groupPlan(planFor(o, it.routes || o.lines.map(l => l.qid)), o.needed), tot = r2(g.reduce((s, x) => s + x.total, 0));
  return `Send ${rm(tot)} to ${g.map(x => supName(x.sup)).join(' + ')}${g[0].sup !== o.sup ? ` (rerouted from ${supName(o.sup)}, was ${rm(o.total)})` : ''} · arrives ${dshort(g[0].next)}${g.some(x => !x.onTime) ? ' · after needed date' : ''}`;
}
function buildDecision(items){
  const ok = [], errs = [];
  items.forEach(it => { const err = it.id.startsWith('R-') ? checkReq(it.id, it.approve) : checkPO(it.id); if (err) errs.push(esc(err)); else ok.push(Object.assign(it, {effect:effectOf(it)})); });
  if (errs.length) hqBot(errs.join('<br>'));
  if (!ok.length) return;
  const pid = 'c' + (S.seq++); S.cprops[pid] = {items:ok, status:'pending'}; S.chat.push({role:'card', pid});
}
function cardHTML(pid){

  const rows = p.items.map(it => {

    return `<tr><td><b>${it.id}</b><br><span class="note">${sub}</span></td><td>${it.approve ? '<span class="badge b-ok">Approve</span>' : '<span class="badge b-bad">Reject</span>'}</td><td>${esc(it.effect)}</td></tr>`;

/* ---------------- tu choi: hop thoai + hoan tac ---------------- */

/* Hop thoai tu choi dung chung cho ca phieu kho lan don mua. Esc, nut X va
   bam ra ngoai deu dong duoc vi no di qua openDlg/closeDlg san co.
   Ban nhap duoc giu theo tung phieu (S.rejDraft), nen dong nham khong mat
   chu da go. */
function rejDlg(kind, id){
  const isPO = kind === 'po';
  const o = isPO ? PO.find(x => x.id === id) : REQ.find(x => x.id === id);
  if (!o) return;
  const err = isPO ? checkPO(id) : checkReq(id, false);
  if (err) { toast(err); return; }
  const what = isPO ? `${supName(o.sup)} · ${rm(o.total)}` : `${TYPE[o.type]} · ${IB(o.ing).name} ${fd(o.ing, reqDelta(o))}`;
  const keep = S.rejDraft && S.rejDraft.id === id ? S.rejDraft.text : '';
  openDlg(`<div class="dlg-h"><div><h2 id="dlgTitle">Reject ${esc(id)}?</h2><p>${esc(what)}</p></div>${xBtn()}</div>
  <div class="dlg-b">
    <p class="note" style="margin:0">${isPO ? 'Nothing is ordered and no supplier is contacted.' : 'Stock is not changed.'} ${esc(uName(o.by))} sees your reason and can resubmit.</p>
    <label class="field">Reason<textarea id="rejNote" rows="3" aria-describedby="rejErr" placeholder="${isPO ? 'e.g. Prawns on hand cover two more days' : 'e.g. Attach the delivery order and resubmit'}">${esc(keep)}</textarea></label>
    <p class="errline" id="rejErr" role="alert" hidden>${AL_ICON}<span></span></p>
  </div>
  <div class="dlg-f"><button type="button" class="btn" data-act="dlg-close">Cancel</button><button type="button" class="btn danger" data-act="rejgo" data-v="${esc(kind)}:${esc(id)}">${I_NO}Reject ${isPO ? 'order' : 'request'}</button></div>`);
  const ta = $('#rejNote');
  if (ta) {
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.addEventListener('input', () => { S.rejDraft = {id, text:ta.value}; ta.removeAttribute('aria-invalid'); $('#rejErr').hidden = true; });
  }
}
function rejErr(msg){
  const ta = $('#rejNote'), box = $('#rejErr');
  if (box) { box.querySelector('span').textContent = msg; box.hidden = false; }
  if (ta) { ta.setAttribute('aria-invalid', 'true'); ta.focus(); }
}

/* Anh chup truoc khi quyet dinh, de dung lai neu nguoi dung bam Undo.
   Undo KHONG xoa dong audit cu: mot nhat ky ma nguoi dung xoa duoc thi
   khong con la nhat ky. No ghi them mot dong dao nguoc, con so kho va
   trang thai phieu thi quay ve dung nhu truoc. */
function snapReq(id){
  const r = REQ.find(x => x.id === id); if (!r) return null;
  const i = IB(r.ing);
  const was = {status:r.status, dBy:r.dBy, dAt:r.dAt, note:r.note, onHand:i.onHand};
  return () => {
    const did = r.status;
    Object.assign(r, was); i.onHand = was.onHand;
    audit('Stock', `Undid ${did === 'approved' ? 'approval' : 'rejection'} of ${r.id} · back to pending${did === 'approved' ? ' · ' + i.name + ' back to ' + fq(r.ing, i.onHand) : ''}`);
    S.reqTab = 'pending'; S.reqSel = r.id;
    render(); toast(`${r.id} is back in the queue`); focusQueue();
  };
}
/* Don mua kho hon: duyet mot don co the TACH no thanh nhieu don moi va day
   vao mang PO. Nen anh chup phai giu ca do dai mang lan ban sao nong cua
   tung don, va khi dung lai thi xoa ca nhung khoa ma decidePO moi them vao
   (eta, method, rerouted, splitFrom) — Object.assign khong tu xoa chung. */
function snapPO(id){
  const keep = PO.map(o => ({o, c:Object.assign({}, o)})), n = PO.length;
  return () => {
    PO.length = n;
    keep.forEach(k => { Object.keys(k.o).forEach(key => { if (!(key in k.c)) delete k.o[key]; }); Object.assign(k.o, k.c); });
    audit('Supplier order', `Undid decision on ${id} · back to pending`);
    S.poTab = 'pending'; S.poSel = id; S.poRoute = null;
    render(); toast(`${id} is back in the queue`); focusQueue();
  };
}

/* ---------------- dialogs ---------------- */
let opener = null;
const xBtn = () => `<button type="button" class="x" data-act="dlg-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>`;
function openDlg(html){ opener = document.activeElement; $('#dlgBox').innerHTML = html; $('#dlg').hidden = false; enhanceSelects($('#dlgBox')); const f = $('#dlgBox').querySelector('input:not([readonly]), .ddb, button.primary'); if (f) f.focus(); }
function closeDlg(){ $('#dlg').hidden = true; draft = null; if (opener && document.body.contains(opener)) opener.focus(); }

/* ---------------- dropdown tu dung ---------------- */
const DDC = '<svg class="ddc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>';
const DDK = '<svg class="ddk" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
function paintDD(sel){
  const wrap = sel.closest('.dd'), btn = wrap.querySelector('.ddb'), menu = wrap.querySelector('.ddm');
  const cur = sel.options[sel.selectedIndex];
  btn.innerHTML = `<span class="ddt">${esc(cur ? cur.text : '')}</span>${DDC}`;
  btn.disabled = sel.disabled;
  menu.innerHTML = [...sel.options].map((o, i) =>
    `<button type="button" class="ddo" role="option" aria-selected="${i === sel.selectedIndex}" data-i="${i}"${o.disabled ? ' disabled' : ''}>${DDK}<span>${esc(o.text)}</span></button>`).join('');
}
/* Khoa nhan dang mot <select> de lay lai focus sau khi DOM bi dung lai.
   Khong dung chi id: nhieu select sinh ra trong bang khong co id, chi phan
   biet nhau bang aria-label + data-k. */
let ddFocus = null;
const ddKey = s => [s.id, s.getAttribute('aria-label') || '', s.dataset.chg || '', s.dataset.dchg || '', s.dataset.k || ''].join('|');
function enhanceSelects(root){
  (root || document).querySelectorAll('select').forEach(sel => {
    if (!sel.closest('.dd')) {
      const wrap = document.createElement('div');
      wrap.className = 'dd' + (sel.classList.contains('sel-sm') ? ' sm' : '');
      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(sel);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'ddb';
      btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
      const lbl = sel.getAttribute('aria-label'); if (lbl) btn.setAttribute('aria-label', lbl);
      const menu = document.createElement('div');
      menu.className = 'ddm'; menu.setAttribute('role', 'listbox'); menu.hidden = true;
      if (lbl) menu.setAttribute('aria-label', lbl);
      wrap.appendChild(btn); wrap.appendChild(menu);
    }
    paintDD(sel);
  });
  /* Lay lai focus sau render(). Bo qua nut dang nam trong khoi bi an —
     vi du o Role trong menu tai khoan, vi menu da dong ngay truoc do. */
  if (ddFocus) {
    const t = [...document.querySelectorAll('.dd > select')].find(s => ddKey(s) === ddFocus);
    ddFocus = null;
    if (t) { const b = t.closest('.dd').querySelector('.ddb'); if (b && !b.disabled && b.offsetParent) b.focus(); }
  }
}
function closeDD(wrap){
  const m = wrap.querySelector('.ddm');
  if (m.hidden) return;
  m.hidden = true; m.classList.remove('up');
  wrap.querySelector('.ddb').setAttribute('aria-expanded', 'false');
}
function closeAllDD(except){ document.querySelectorAll('.dd').forEach(w => { if (w !== except) closeDD(w); }); }
function openDD(wrap){
  closeAllDD(wrap);
  const btn = wrap.querySelector('.ddb'), m = wrap.querySelector('.ddm');
  m.hidden = false; btn.setAttribute('aria-expanded', 'true');
  /* Khong du cho ben duoi thi lat nguoc len — menu 8 muc cao ~340px, o cuoi
     mot bang dai thi no se tran khoi man hinh. */
  const r = m.getBoundingClientRect();
  if (r.bottom > window.innerHeight - 8 && wrap.getBoundingClientRect().top > r.height) m.classList.add('up');
  /* Menu rong hon nut bam, nen mot nut nam sat mep phai man hinh (vi du o
     trong menu tai khoan) se day menu TRAN RA NGOAI va lam ca trang cuon
     ngang. Do that: 336px menu tai x=1199 cham 1535 tren man 1440.
     Neo lai ve mep phai cua wrapper thi no khong the vuot ra nua. */
  m.classList.remove('rt');
  if (m.getBoundingClientRect().right > window.innerWidth - 8) m.classList.add('rt');
  const on = m.querySelector('[aria-selected="true"]') || m.querySelector('.ddo:not(:disabled)');
  if (on) on.focus();
}
function pickDD(wrap, i){
  const sel = wrap.querySelector('select');
  if (sel.options[i] && sel.options[i].disabled) return;
  const changed = sel.selectedIndex !== i;
  sel.selectedIndex = i;
  paintDD(sel);
  closeDD(wrap);
  ddFocus = ddKey(sel);
  if (changed) sel.dispatchEvent(new Event('change', {bubbles: true}));
  /* Neu handler goi render() thi nut vua bam DA bi thay the va enhanceSelects
     lay lai focus giup. Neu khong render lai thi ddFocus van con — tu focus. */
  if (ddFocus) { ddFocus = null; const b = wrap.querySelector('.ddb'); if (b) b.focus(); }
}
document.addEventListener('click', e => {
  const wrap = e.target.closest('.dd');
  if (!wrap) { closeAllDD(); return; }
  const o = e.target.closest('.ddo');
  if (o) { pickDD(wrap, Number(o.dataset.i)); return; }
  if (e.target.closest('.ddb')) { wrap.querySelector('.ddm').hidden ? openDD(wrap) : closeDD(wrap); }
});
document.addEventListener('keydown', e => {
  const wrap = e.target.closest('.dd'); if (!wrap) return;
  const m = wrap.querySelector('.ddm'), open = !m.hidden;
  if (e.key === 'Escape' && open) { e.stopPropagation(); closeDD(wrap); wrap.querySelector('.ddb').focus(); return; }
  if (!open && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') && e.target.closest('.ddb')) { e.preventDefault(); openDD(wrap); return; }
  if (!open) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End') {
    e.preventDefault();
    const items = [...m.querySelectorAll('.ddo:not(:disabled)')];
    const at = items.indexOf(document.activeElement);
    const to = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1
      : e.key === 'ArrowDown' ? Math.min(items.length - 1, at + 1) : Math.max(0, at - 1);
    if (items[to]) items[to].focus();
  }
}, true);

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  /* Phai dat TRUOC dong `if (!el) return` ben duoi, neu khong thi bam ra cho
     trong se thoat som va menu khong bao gio dong. */
  if (!e.target.closest('.who-wrap') && !$('#whoMenu').hidden) toggleWho(false);
  if (e.target.id === 'dlg') { closeDlg(); return; }
  /* Bam bat ky dau trong hang cung mo chi tiet. Chi UY QUYEN cho nut
     .rowbtn co san — khong them hanh dong nao moi — va bo qua khi cham
     dung vao mot thu tu no da bam duoc. */
  const row = e.target.closest('tbody tr');
  if (row && !e.target.closest('button, a, input, select, textarea, label')) {
    const rb = row.querySelector('.rowbtn');
    if (rb) { rb.click(); return; }
  }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'who-menu': toggleWho(); break;
    case 'rail': setRail(document.documentElement.getAttribute('data-rail') !== 'min'); break;
    case 'switch': S.user = v; toggleWho(false); render(); toast('Signed in as ' + me().name + ' (' + ROLES[me().role] + ')'); break;
    case 'period': S.period = v; render(); break;
    case 'reqtab': S.reqTab = v; S.reqSel = null; render(); break;
    case 'reqflag': S.reqFlags = S.reqFlags.includes(v) ? S.reqFlags.filter(x => x !== v) : S.reqFlags.concat(v); S.reqSel = null; render(); break;
    /* Bam ten nguyen lieu trong the chi tiet: sang man Ingredients VA lam
       noi dung hang do len, roi cuon toi. Khong lam noi thi nguoi dung roi
       vao mot bang muoi dong khong biet nhin dau. */
    case 'going': { S.ingSel = v; location.hash = '#ingredients'; render(); const row = $('#view tr.sel'); if (row) row.scrollIntoView({block:'center'}); break; }
    case 'req': S.reqSel = v; render(); break;
    /* Reject chi MO hop thoai, chua quyet dinh gi. Quyet dinh that nam o
       'rejgo' ben duoi — dung chung cho ca phieu kho lan don mua. */
    case 'reject': rejDlg('req', v); break;
    case 'po-no': rejDlg('po', v); break;
    case 'rejgo': {
      const [kind, id] = v.split(':');
      const note = (($('#rejNote') || {}).value || '').trim();
      /* Loi hien NGAY TRONG hop thoai va o nhap duoc danh dau aria-invalid.
         Truoc day loi chi song trong mot toast 3,6 giay roi bien mat. */
      if (!note) { rejErr(kind === 'po' ? 'Add a reason so the outlet knows why.' : 'Add a reason so the outlet knows what to fix.'); break; }
      const undo = kind === 'po' ? snapPO(id) : snapReq(id);
      const res = kind === 'po' ? decidePO(id, false, note) : decideReq(id, false, note);
      if (!res.ok) { rejErr(res.msg); break; }
      S.rejDraft = null; closeDlg();
      advanceQueue(kind, id); render(); toast(res.msg, undo); focusQueue(); break; }
    /* Duyet van la MOT cu bam — hang doi nay duoc xu nhieu lan moi ngay nen
       them mot hop thoai xac nhan chi doi lay phan xa bam. Luoi an toan la
       Undo trong toast, dat sau hanh dong chu khong truoc. */
    case 'approve': {
      const undo = snapReq(v);
      const res = decideReq(v, true, '');
      if (!res.ok) { toast(res.msg); break; }
      advanceQueue('req', v); render(); toast(res.msg, undo); focusQueue(); break; }
    case 'potab': S.poTab = v; S.poSel = null; render(); break;
    case 'pocheap': { const o = PO.find(x => x.id === S.poSel); if (!o) break; getRoute(o); S.poRoute.q = cheapestOnTime(o); render(); toast('Routed each line to the cheapest supplier that delivers on time'); break; }
    case 'poreset': S.poRoute = null; render(); break;
    case 'suppf': S.suppFilter = v; render(); break;
    case 'newsup': supForm(null); break;
    case 'editsup': supForm(v); break;
    case 'savesup': {
      const k = $('#supForm').dataset.k, name = $('#s_name').value.trim(), cat = $('#s_cat').value.trim(), lead = Math.max(0, Math.round(Number($('#s_lead').value) || 0)), min = Math.max(0, Number($('#s_min').value) || 0), via = $('#s_via').value, days = [...document.querySelectorAll('.s_day:checked')].map(x => Number(x.value));
      if (!name) { $('#s_err').textContent = 'Give the supplier a name.'; $('#s_name').focus(); break; }
      if (!days.length) { $('#s_err').textContent = 'Pick at least one delivery day.'; break; }
      const key = k || 's' + (S.seq++);
      SUPP[key] = name + (cat ? ' · ' + cat : '');
      SUPINFO[key] = Object.assign(SUPINFO[key] || {active:true}, {lead, min, via, days});
      audit('Supplier', `${k ? 'Updated' : 'Added'} ${name} · lead ${lead} d · min ${rm(min)} · ${via}`);
      closeDlg(); render(); toast(k ? `${name} updated` : `${name} added · add quotes to route ingredients to them`); break; }
    case 'togsup': {
      const s = SUPINFO[v]; s.active = !s.active;
      const moved = [], stuck = [];
      if (!s.active) QUOTES.filter(q => q.sup === v && q.route).forEach(q => {
        const alt = QUOTES.filter(x => x.ing === q.ing && x.sup !== v && SUPINFO[x.sup].active).sort((a, b) => a.price / a.pack - b.price / b.pack)[0];
        if (alt) { q.route = false; alt.route = true; moved.push(`${IB(q.ing).name} → ${supName(alt.sup)}`); } else stuck.push(IB(q.ing).name);
      });
      audit('Supplier', `${supName(v)} ${s.active ? 'reactivated' : 'deactivated'}${moved.length ? ' · routes moved: ' + moved.join(', ') : ''}`);
      render(); toast(`${supName(v)} ${s.active ? 'is active again' : 'deactivated'}${moved.length ? ' · routes moved: ' + moved.join(', ') : ''}${stuck.length ? ' · no other supplier for ' + stuck.join(', ') : ''}`); break; }
    case 'po': S.poSel = v; render(); break;
    case 'po-ok': {
      const undo = snapPO(v);
      const res = decidePO(v, true, '', S.poRoute && S.poRoute.id === v ? S.poRoute.q : null);
      if (!res.ok) { toast(res.msg); break; }
      S.poRoute = null;
      advanceQueue('po', v); render(); toast(res.msg, undo); focusQueue(); break; }
    case 'hq-send': { const ta = $('#hqIn'); hqSend(ta ? ta.value : ''); break; }
    /* Chip goi y ben man tro ly va nut mui ten tren dashboard dung CHUNG
       hanh dong nay. Bam tu dashboard thi phai sang man tro ly truoc, neu
       khong cau tra loi se nam o mot man khong ai nhin thay. */
    case 'hq-ask': if (route() !== 'assistant') location.hash = '#assistant'; hqSend(v); break;
    case 'hq-ok': {
      const p = S.cprops[v]; if (!p || p.status !== 'pending') break;
      p.results = p.items.map(it => (it.id.startsWith('R-') ? decideReq(it.id, it.approve, it.note || '') : decidePO(it.id, it.approve, it.note || '', it.routes || null)).msg);
      p.status = 'applied'; render(); toast(p.results.join(' · ')); break; }
    case 'hq-no': { const p = S.cprops[v]; if (p && p.status === 'pending') p.status = 'cancelled'; render(); break; }
    case 'editdish': openDish(v); break;
    case 'addline': draft.recipe.push([ING[0].id, 0]); renderDish(); break;
    case 'rmline': draft.recipe.splice(Number(el.dataset.k), 1); renderDish(); break;
    case 'savedish': {
      const m = MENU.find(x => x.id === draft.id), ch = [];
      const rec = draft.recipe.filter(([, q]) => Number(q) > 0).map(([id, q]) => [id, Number(q)]);
      if (!(Number(draft.price) > 0)) { toast('Enter a price above zero'); break; }
      if (Number(draft.price) !== m.price) ch.push(`price ${rm(m.price)} → ${rm(Number(draft.price))}`);
      if (JSON.stringify(rec) !== JSON.stringify(m.recipe)) ch.push('recipe updated');
      if ((draft.grab || null) !== m.grab || (draft.fp || null) !== m.fp) ch.push('channel prices updated');
      m.price = r2(Number(draft.price)); m.recipe = rec; m.grab = draft.grab || null; m.fp = draft.fp || null;
      if (ch.length) audit('Menu', `${m.name} · ${ch.join(', ')}`);
      closeDlg(); render(); toast(ch.length ? `${m.name} saved · tills update on next sync` : 'No changes');
      break; }
    case 'newing': ingForm(null); break;
    case 'editing': ingForm(IB(v)); break;
    case 'saveing': {
      const id = $('#ingForm').dataset.id, name = $('#f_name').value.trim(), unit = $('#f_unit').value, low = Number($('#f_low').value) || 0, c = $('#f_cost').value;
      if (!name) { toast('Give the ingredient a name'); $('#f_name').focus(); break; }
      if (!id && ING.some(i => i.name.toLowerCase() === name.toLowerCase())) { toast(`${name} is already in the catalogue`); break; }
      if (id) { const i = IB(id); i.unit = unit; i.low = low; i.manual = c === '' ? null : Number(c); audit('Catalogue', `${i.name} · unit ${unit}, low at ${low}`); }
      else { const nid = name.toLowerCase().replace(/[^a-z0-9]+/g, '_'); ING.push({id:nid, name, unit, low, onHand:0, manual:c === '' ? null : Number(c)}); audit('Catalogue', `Added ${name} (${unit})`); const fi = FLAGS_ING.findIndex(f => f.name.toLowerCase() === name.toLowerCase()); if (fi > -1) FLAGS_ING.splice(fi, 1); }
      closeDlg(); render(); toast(id ? 'Ingredient updated' : `${name} added for every outlet`);
      break; }
    case 'flagadd': { const f = FLAGS_ING.find(x => x.id === v); ingForm(null, f.name); break; }
    case 'flagno': { const k = FLAGS_ING.findIndex(x => x.id === v); const f = FLAGS_ING.splice(k, 1)[0]; audit('Catalogue', `Declined outlet request · ${f.name}`); render(); toast(`${f.name} declined · ${uName(f.by)} notified`); break; }
    case 'newquote': quoteForm(); break;
    case 'savequote': {
      const q = {id:'q' + (S.seq++), sup:$('#q_sup').value, ing:$('#q_ing').value, pack:Number($('#q_pack').value), price:Number($('#q_price').value), tag:$('#q_tag').checked, route:$('#q_route').checked};
      if (!(q.pack > 0) || !(q.price >= 0)) { toast('Enter a pack size and price'); break; }
      if (q.tag) QUOTES.forEach(x => { if (x.ing === q.ing) x.tag = false; });
      if (q.route) QUOTES.forEach(x => { if (x.ing === q.ing) x.route = false; });
      if (!QUOTES.some(x => x.ing === q.ing && x.route)) q.route = true;
      QUOTES.push(q); audit('Supplier', `Quote added · ${SUPP[q.sup].split(' · ')[0]} · ${IB(q.ing).name} ${q.pack} ${IB(q.ing).unit} ${rm(q.price)}${q.tag ? ' · tagged as cost basis' : ''}`);
      closeDlg(); render(); toast('Quote added'); break; }
    case 'newpromo': promoForm(); break;
    case 'savepromo': {
      const items = [...document.querySelectorAll('.p_item:checked')].map(x => x.value), days = [...document.querySelectorAll('.p_day:checked')].map(x => Number(x.value)), ch = [...document.querySelectorAll('.p_ch:checked')].map(x => x.value);
      const name = $('#p_name').value.trim(), type = $('#p_type').value, val = Number($('#p_val').value), st = $('#p_start').value, en = $('#p_end').value;
      const err = !name ? 'Give the promotion a name.' : !items.length ? 'Pick at least one dish.' : !days.length ? 'Pick at least one day.' : !ch.length ? 'Pick at least one channel.' : !(st < en) ? 'End time must be after start time.' : (type === 'pct' && (val <= 0 || val >= 100)) ? 'Percent must be between 1 and 99.' : !(val > 0) ? 'Enter a value above zero.' : '';
      if (err) { $('#p_err').textContent = err; break; }
      const p = {id:'p' + (S.seq++), name, type, value:val, items, days, start:st, end:en, ch, on:true}; PROMOS.push(p);
      audit('Promotion', `Created ${name} · ${promoRule(p)}`); closeDlg(); render(); toast(`${name} created`); break; }
    case 'togpromo': { const p = PROMOS.find(x => x.id === v); p.on = !p.on; audit('Promotion', `${p.name} ${p.on ? 'switched on' : 'switched off'}`); render(); break; }
    case 'delpromo': { const k = PROMOS.findIndex(x => x.id === v); const p = PROMOS.splice(k, 1)[0]; audit('Promotion', `Deleted ${p.name}`); render(); toast(`${p.name} deleted`); break; }
    case 'closeonly': S.closeOnly = !S.closeOnly; render(); break;
    case 'review': { const c = CLOSES[Number(v)]; c.reviewed = true; c.rBy = me().name; audit('Close', `Reviewed ${c.day.toLocaleDateString('en-GB', {day:'numeric', month:'short'})} close · ${rm(r2(c.cnt - c.exp))} · ${c.reason}`); render(); toast('Close marked as reviewed'); break; }
    case 'toguser': { const u = USERS.find(x => x.id === v); u.active = !u.active; audit('Users', `${u.name} ${u.active ? 'reactivated' : 'deactivated'}`); render(); break; }
    case 'pin': { const u = USERS.find(x => x.id === v); audit('Users', `PIN reset for ${u.name}`); toast(`${u.name} sets a new PIN at next sign-in`); break; }
    case 'savecap': { const c = Number($('#capIn').value); if (!(c >= 0)) break; AI.cap = c; audit('Assistant', `Monthly LLM cap set to ${rm(c)}`); render(); toast('Cap saved'); break; }
    case 'addsyn': { const w = $('#synW').value.trim().toLowerCase(), t = $('#synT').value; if (!w) { toast('Type a word or code'); break; } if (AI.syn.some(s => s[0] === w)) { toast(`“${w}” is already mapped`); break; } AI.syn.push([w, t]); audit('Assistant', `Synonym added · “${w}” → ${t}`); render(); toast('Synonym added'); break; }
    case 'delsyn': { const s = AI.syn.splice(Number(v), 1)[0]; audit('Assistant', `Synonym removed · “${s[0]}”`); render(); break; }
    case 'copycsv': {
      const rows = auditRows(), csv = ['When,User,Type,Change'].concat(rows.map(a => [dt(a.at), a.user, a.type, a.text].map(x => '"' + String(x).replace(/"/g, '""') + '"').join(','))).join('\n');
      const done = () => toast(`${rows.length} rows copied as CSV`);
      const fallback = () => { const ta = $('#csvOut'); ta.value = csv; ta.classList.remove('sr'); ta.style.cssText = 'width:100%;min-height:160px'; ta.removeAttribute('aria-hidden'); ta.select(); toast('Clipboard blocked — the CSV is selected below, press Ctrl/Cmd+C'); };
      try { navigator.clipboard.writeText(csv).then(done, fallback); } catch (err) { fallback(); }
      break; }
    case 'dlg-close': closeDlg(); break;
    case 'undo': runUndo(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'roleSel') { S.user = t.value; toggleWho(false); render(); $('#whoBtn').focus(); toast('Signed in as ' + me().name + ' (' + ROLES[me().role] + ')'); return; }
  if (t.dataset.chg === 'route') { const q = QUOTES.find(x => x.id === t.value); QUOTES.forEach(x => { if (x.ing === q.ing) x.route = x.id === q.id; }); audit('Supplier', `Route for ${IB(q.ing).name} → ${supName(q.sup)}`); render(); toast(`${IB(q.ing).name} orders now go to ${supName(q.sup)} by default`); return; }
  if (t.dataset.chg === 'poline') { const o = PO.find(x => x.id === S.poSel); if (!o) return; getRoute(o)[Number(t.dataset.k)] = t.value; render(); return; }
  if (t.dataset.chg === 'poall') { const o = PO.find(x => x.id === S.poSel); if (!o || !t.value) return; const r = routesVia(o, t.value); if (r.err) { toast(r.err); render(); return; } getRoute(o); S.poRoute.q = r.q; render(); toast(`Whole order routed to ${supName(t.value)}`); return; }
  if (t.dataset.chg === 'tag') { const q = QUOTES.find(x => x.id === t.value); const before = MENU.filter(m => m.recipe.some(l => l[0] === q.ing)).map(m => [m.name, plate(m)]); QUOTES.forEach(x => { if (x.ing === q.ing) x.tag = x.id === q.id; }); audit('Supplier', `Cost basis for ${IB(q.ing).name} → ${SUPP[q.sup].split(' · ')[0]} ${rm(q.price / q.pack)}/${IB(q.ing).unit}`); render(); const ch = before.map(([n, c]) => { const m = MENU.find(x => x.name === n); return `${n} ${rm(c)} → ${rm(plate(m))}`; }); toast('Plate cost updated: ' + ch.join('; ')); return; }
  if (t.dataset.chg === 'role') { const u = USERS.find(x => x.id === t.dataset.v); audit('Users', `${u.name} role ${ROLES[u.role]} → ${ROLES[t.value]}`); u.role = t.value; render(); toast(`${u.name} is now ${ROLES[u.role]}`); return; }
  if (t.dataset.chg === 'atype') { S.auditType = t.value; $('#auditBody').innerHTML = auditBody(); return; }
  if (t.dataset.dchg && draft) {
    const k = Number(t.dataset.k), f = t.dataset.dchg;
    if (f === 'price') draft.price = Number(t.value);
    else if (f === 'grab' || f === 'fp') draft[f] = t.value === '' ? null : r2(Number(t.value));
    else if (f === 'ing') draft.recipe[k][0] = t.value;
    else if (f === 'qty') draft.recipe[k][1] = Number(t.value);
    renderDish();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.inp === 'menuQ') { S.menuQ = t.value; const q = S.menuQ.toLowerCase(); $('#menuBody').innerHTML = menuRows(MENU.filter(m => !q || m.name.toLowerCase().includes(q))); }
  if (t.dataset.inp === 'auditQ') { S.auditQ = t.value; $('#auditBody').innerHTML = auditBody(); }
});
document.addEventListener('keydown', e => {
  /* Undo bang ban phim theo quy uoc chung. Nut trong toast van la duong
     chinh (man hinh dich la may tinh bang), day chi la loi tat cho ban phim
     — va no khong duoc cuop phim undo cua chinh o nhap dang go. */
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')
      && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) {
    if (runUndo()) { e.preventDefault(); return; }
  }
  if (e.key === 'Escape' && !$('#whoMenu').hidden) { toggleWho(false); $('#whoBtn').focus(); return; }
  if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg();
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'hqIn') { e.preventDefault(); hqSend(e.target.value); }
});
document.addEventListener('submit', e => { e.preventDefault(); const b = $('#dlgBox [data-act="saveing"]'); if (b) b.click(); });
window.addEventListener('hashchange', () => { if (route() !== 'ingredients') S.ingSel = null; render(); $('#view').focus({preventScroll:true}); });

/* ---------------- start ---------------- */
S.chat.push({role:'bot', html:'Ask how today is going, see what’s waiting, or decide requests by ID — for example “approve R-1048” or “reject PO-0313 because prawns on hand cover two more days”. I show every decision first; nothing changes until you confirm.'});
let rail0 = 'full';
try { rail0 = localStorage.getItem('prb-hq-rail') || 'full'; } catch (e) {}
setRail(rail0 === 'min');
render();
})();
</script>
